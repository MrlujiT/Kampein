<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kampein — Demo</title>
<meta name="description" content="Kampein demo: campaign management for Kenyan candidates. Teams, targets, money and election-day tallying.">
<style>
  :root {
    --g900:#0a321c; --g700:#115a31; --g600:#17723e; --g500:#1f8a4c; --g100:#d5ecdc; --g50:#eef7f1;
    --z900:#18181b; --z700:#3f3f46; --z500:#71717a; --z300:#d4d4d8; --z200:#e4e4e7; --z100:#f4f4f5; --z50:#fafafa;
    --red:#b42318; --redbg:#fef3f2; --amber:#b54708; --amberbg:#fffaeb; --blue:#175cd3; --bluebg:#eff8ff;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--z50); color:var(--z900); font-size:14px; }
  button, input, select { font:inherit; }
  .demo-bar { background:#fef0c7; color:#7a2e0e; font-size:12px; padding:6px 16px; text-align:center; }
  .demo-bar button { background:none; border:none; text-decoration:underline; color:inherit; cursor:pointer; padding:0 4px; }
  .shell { display:flex; min-height:calc(100vh - 28px); }
  aside { width:240px; flex-shrink:0; background:var(--g900); color:var(--g50); display:flex; flex-direction:column; }
  .brand { padding:20px 20px 8px; font-size:22px; font-weight:800; letter-spacing:-.02em; }
  .camp { padding:0 20px 16px; font-size:13px; }
  .camp small { display:block; opacity:.65; font-size:12px; margin-top:2px; }
  nav { display:flex; flex-direction:column; gap:2px; padding:0 10px; }
  nav a { color:inherit; text-decoration:none; padding:9px 12px; border-radius:6px; font-size:14px; display:flex; justify-content:space-between; align-items:center; }
  nav a:hover { background:rgba(255,255,255,.08); }
  nav a.on { background:rgba(255,255,255,.14); font-weight:600; }
  nav .badge { background:#f04438; color:#fff; border-radius:999px; font-size:11px; padding:1px 7px; font-weight:600; }
  .who { margin-top:auto; border-top:1px solid rgba(255,255,255,.12); padding:16px 20px; font-size:12px; }
  .who label { opacity:.65; display:block; margin-bottom:6px; }
  .who select { width:100%; background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.2); border-radius:6px; padding:7px; }
  .who select option { color:#000; }
  main { flex:1; padding:28px 32px; min-width:0; }
  h1 { font-size:24px; margin:0; letter-spacing:-.01em; }
  .sub { color:var(--z500); margin:4px 0 22px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--z500); margin:28px 0 10px; }
  .grid { display:grid; gap:14px; }
  .g4 { grid-template-columns:repeat(4,minmax(0,1fr)); }
  .g3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .g2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .card { background:#fff; border:1px solid var(--z200); border-radius:10px; padding:18px; }
  .stat .l { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--z500); font-weight:600; }
  .stat .v { font-size:26px; font-weight:700; margin-top:6px; letter-spacing:-.01em; }
  .stat .h { font-size:12px; color:var(--z500); margin-top:2px; }
  .bar { height:8px; background:var(--z100); border-radius:999px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--g500); border-radius:999px; }
  .bar.ours i { background:var(--g500); } .bar.them i { background:#98a2b3; }
  .row { display:flex; justify-content:space-between; gap:10px; font-size:13px; margin-bottom:5px; }
  .muted { color:var(--z500); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--z500); font-weight:600; padding:9px 12px; border-bottom:1px solid var(--z200); white-space:nowrap; }
  td { padding:9px 12px; border-bottom:1px solid var(--z100); vertical-align:top; }
  tr:last-child td { border-bottom:none; }
  .tablecard { padding:0; overflow-x:auto; }
  .r { text-align:right; }
  .pill { display:inline-block; border-radius:999px; padding:2px 9px; font-size:11px; font-weight:600; white-space:nowrap; }
  .p-req { background:var(--amberbg); color:var(--amber); }
  .p-ok { background:var(--g50); color:var(--g700); }
  .p-paid { background:var(--bluebg); color:var(--blue); }
  .p-no { background:var(--redbg); color:var(--red); }
  .p-wait { background:var(--z100); color:var(--z700); }
  .btn { background:var(--g600); color:#fff; border:none; border-radius:6px; padding:8px 14px; font-weight:600; cursor:pointer; font-size:13px; }
  .btn:hover { background:var(--g700); }
  .btn.ghost { background:#fff; color:var(--z700); border:1px solid var(--z300); }
  .btn.ghost:hover { background:var(--z50); }
  .btn.sm { padding:5px 10px; font-size:12px; }
  .btn.danger { background:#fff; color:var(--red); border:1px solid #fecdca; }
  form.inline { display:grid; gap:10px; align-items:end; }
  .f label { display:block; font-size:11px; font-weight:600; color:var(--z500); margin-bottom:4px; }
  .f input, .f select { width:100%; border:1px solid var(--z300); border-radius:6px; padding:8px 10px; background:#fff; }
  .f input:focus, .f select:focus { outline:2px solid var(--g100); border-color:var(--g500); }
  .note { background:var(--g50); border:1px solid var(--g100); color:var(--g700); border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:16px; }
  .note.warn { background:var(--amberbg); border-color:#fedf89; color:var(--amber); }
  .rule { font-size:12px; color:var(--z500); display:flex; gap:6px; margin-top:6px; }
  .rule::before { content:'🔒'; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--z900); color:#fff; padding:11px 18px; border-radius:8px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.2); z-index:50; max-width:90vw; }
  .toast.err { background:var(--red); }
  .rank { color:var(--z500); width:22px; display:inline-block; }
  .form34 { background:#fffdf5; border:1px solid #e9dfc4; border-radius:6px; padding:14px; font-family:'Courier New',monospace; font-size:12px; color:#2b2b2b; transform:rotate(-.6deg); box-shadow:2px 3px 0 rgba(0,0,0,.05); }
  .form34 .t { text-align:center; font-weight:700; font-size:13px; margin-bottom:2px; }
  .form34 table td { padding:4px 6px; border-bottom:1px dashed #d8cfb4; font-family:inherit; }
  .form34 .hw { font-family:'Segoe Print','Bradley Hand','Comic Sans MS',cursive; font-size:15px; color:#1d3a8a; }
  .form34 .stamp { margin-top:8px; display:flex; justify-content:space-between; font-size:11px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:13px; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .tabs button { border:1px solid var(--z300); background:#fff; border-radius:999px; padding:5px 12px; font-size:12px; cursor:pointer; }
  .tabs button.on { background:var(--g900); color:#fff; border-color:var(--g900); }
  .empty { border:1px dashed var(--z300); border-radius:10px; padding:28px; text-align:center; color:var(--z500); }

  /* ---- Map ---- */
  .mapwrap { display:grid; grid-template-columns:minmax(0,1.75fr) minmax(0,1fr); gap:14px; align-items:start; }
  .mapcard { background:radial-gradient(120% 90% at 25% 15%, #17552f 0%, #0a321c 55%, #06200f 100%); border-radius:14px; padding:14px 14px 10px; color:#e6f4ea; position:relative; overflow:hidden; }
  .mapcard::after { content:''; position:absolute; inset:0; pointer-events:none; background-image:radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px); background-size:14px 14px; }
  .maptop { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; position:relative; z-index:2; }
  .crumbs { display:flex; gap:4px; align-items:center; font-size:13px; }
  .crumbs button { background:none; border:none; color:#a7d7b8; cursor:pointer; padding:4px 6px; border-radius:6px; font-weight:600; }
  .crumbs button:hover { background:rgba(255,255,255,.08); color:#fff; }
  .crumbs button.cur { color:#fff; }
  .crumbs span { opacity:.4; }
  .layers { display:flex; background:rgba(0,0,0,.25); border-radius:999px; padding:3px; }
  .layers button { background:none; border:none; color:#a7d7b8; font-size:12px; padding:5px 11px; border-radius:999px; cursor:pointer; font-weight:600; }
  .layers button.on { background:#fbbf24; color:#3b2a00; }
  svg.kmap { width:100%; height:auto; display:block; position:relative; z-index:1; }
  svg.kmap .lvl { animation:zin .55s cubic-bezier(.2,.8,.2,1); transform-origin:center; transform-box:fill-box; }
  @keyframes zin { from { opacity:0; transform:scale(.86); } to { opacity:1; transform:scale(1); } }
  .kmap path.rg { stroke:#06200f; stroke-width:.7; cursor:pointer; transition:fill .4s, opacity .2s; }
  .kmap path.rg:hover { stroke:#fff; stroke-width:1.4; }
  .kmap path.rg.sel { stroke:#fff; stroke-width:2.2; }
  .kmap path.camp { stroke:#fbbf24; stroke-width:2.4; filter:drop-shadow(0 0 6px rgba(251,191,36,.7)); }
  .kmap .ring { fill:none; stroke:#fbbf24; stroke-width:2; transform-box:fill-box; transform-origin:center; animation:ring 2.2s ease-out infinite; pointer-events:none; }
  .kmap .ring.b { animation-delay:1.1s; }
  @keyframes ring { from { transform:scale(1); opacity:.95; } to { transform:scale(5); opacity:0; } }
  .kmap .core { fill:#fbbf24; pointer-events:none; }
  .kmap .dot { fill:#fde68a; pointer-events:none; animation:blink 2.6s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity:.25; } 50% { opacity:1; } }
  .kmap text { pointer-events:none; font-family:inherit; paint-order:stroke; stroke:#06200f; stroke-width:3px; stroke-linejoin:round; }
  .kmap .lbl { fill:#fff; font-size:15px; font-weight:700; }
  .kmap .lbl2 { fill:#fde68a; font-size:13px; font-weight:600; }
  .kmap .tag { fill:#fbbf24; font-size:13px; font-weight:700; letter-spacing:.04em; }
  .legend { display:flex; align-items:center; gap:8px; font-size:11px; color:#a7d7b8; position:relative; z-index:2; margin-top:4px; }
  .legend i { flex:1; max-width:220px; height:8px; border-radius:999px; }
  .mappanel .big { font-size:28px; font-weight:800; letter-spacing:-.02em; }
  .mappanel .kicker { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--z500); font-weight:700; }
  .mlist { margin-top:10px; }
  .mlist button { display:grid; grid-template-columns:20px 1fr auto; gap:8px; align-items:center; width:100%; background:none; border:none; padding:6px 4px; border-radius:6px; cursor:pointer; text-align:left; font-size:13px; }
  .mlist button:hover, .mlist button.sel { background:var(--g50); }
  .mlist .mb { grid-column:2 / 4; height:5px; background:var(--z100); border-radius:999px; overflow:hidden; margin-top:-2px; }
  .mlist .mb i { display:block; height:100%; background:var(--g500); }
  .up { color:var(--g600); font-weight:700; }
  .src { font-size:11px; color:var(--z500); margin-top:12px; line-height:1.5; }
  @media (max-width: 900px) { .mapwrap { grid-template-columns:1fr; } }
  .tin { width:72px; text-align:right; border:1px solid var(--z300); border-radius:6px; padding:5px 7px; }
  .tin:disabled { background:transparent; border-color:transparent; color:inherit; }
  .menu-btn { display:none; }
  @media (max-width: 900px) {
    .g4 { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .g3, .g2 { grid-template-columns:1fr; }
  }
  @media (max-width: 760px) {
    .shell { flex-direction:column; }
    aside { width:auto; }
    .brand { padding:14px 16px 4px; display:flex; justify-content:space-between; align-items:center; }
    .camp { padding:0 16px 10px; }
    nav { flex-direction:row; overflow-x:auto; padding:0 8px 8px; }
    nav a { white-space:nowrap; padding:7px 10px; }
    .who { padding:10px 16px; border-top:1px solid rgba(255,255,255,.12); }
    main { padding:20px 16px; }
    h1 { font-size:21px; }
    form.inline { grid-template-columns:1fr 1fr !important; }
    form.inline .wide { grid-column:1 / -1; }
    table.stack thead { display:none; }
    table.stack tr { display:block; padding:10px 4px; border-bottom:1px solid var(--z200); }
    table.stack td { display:flex; justify-content:space-between; gap:12px; border:none; padding:3px 12px; text-align:right; }
    table.stack td::before { content:attr(data-label); color:var(--z500); font-size:11px; text-transform:uppercase; letter-spacing:.04em; text-align:left; flex-shrink:0; padding-top:2px; }
    table.stack td[data-label=""]::before { content:none; }
    table.stack td[data-label=""] { justify-content:flex-end; padding-top:8px; }
  }
</style>
</head>
<body>
<div class="demo-bar">Demo: people, money and campaign activity are made up. Voters, polling centres and stations are IEBC's (2022 register; 2026 ECVR by county). Changes stay in this browser. <button onclick="resetDemo()">Reset demo</button></div>
<div class="shell">
  <aside>
    <div class="brand">Kampein</div>
    <div class="camp" id="camp"></div>
    <nav id="nav"></nav>
    <div class="who">
      <label for="seat">Demo seat</label>
      <select id="seat" onchange="switchSeat(this.value)" style="margin-bottom:10px"></select>
      <label for="who">Viewing as</label>
      <select id="who" onchange="switchUser(this.value)"></select>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="toast"></div>

<script src="stations.js"></script>
<script src="geo.js"></script>
<script>
// ---------------------------------------------------------------------------
// Sample data
// ---------------------------------------------------------------------------
// Five demo campaigns, one per elective seat. Registered-voter figures are IEBC's (2022 register).
const SEATS = {
  mca:       { seat:'MCA', title:'Member of County Assembly', name:'Team Wanjiru 2027', candidate:'Wanjiru Kamande', where:'Clay City Ward, Kasarani', area:'Polling centre', areas:'Polling centres', county:false, scale:0.25 },
  mp:        { seat:'MP', title:'Member of the National Assembly', name:'Team Amani 2027', candidate:'Amani Wekesa', where:'Kasarani, Nairobi', area:'Ward', areas:'Wards', county:false, scale:1 },
  woman_rep: { seat:'Woman Rep', title:'County Woman Member of the National Assembly', name:'Team Halima 2027', candidate:'Halima Abdi', where:'Nairobi County', area:'Constituency', areas:'Constituencies', county:true, scale:3 },
  senator:   { seat:'Senator', title:'Senator', name:'Team Otieno 2027', candidate:'Otieno Mwamba', where:'Nairobi County', area:'Constituency', areas:'Constituencies', county:true, scale:3.5 },
  governor:  { seat:'Governor', title:'County Governor', name:'Team Mutiso 2027', candidate:'Joseph Mutiso', where:'Nairobi County', area:'Constituency', areas:'Constituencies', county:true, scale:5 },
};
let SEAT = 'mp';
try { const v = localStorage.getItem('kampein_demo_seat'); if (SEATS[v]) SEAT = v; } catch {}
let CFG = SEATS[SEAT];
const CAMPAIGN = { election:'2027-08-10' };

const ROLE_LABEL = { owner:'Candidate', manager:'Campaign manager', finance:'Finance lead', coordinator:'Ward coordinator', agent:'Agent', clerk:'Data clerk' };
const KIND_LABEL = { door_to_door:'Door to door', meeting:'Meeting', rally:'Rally', recruitment:'Recruitment', other:'Other' };
const CAT_LABEL = { agent_stipends:'Agent stipends', transport:'Transport', meals:'Meals', materials:'Branded materials', media:'Media & advertising', venues:'Rallies & venues', other:'Other' };
function applySeat() {
  CFG = SEATS[SEAT];
  ROLE_LABEL.coordinator = CFG.area === 'Polling centre' ? 'Centre coordinator' : `${CFG.area} coordinator`;
}

// Real IEBC 2022 polling centres and streams (NRB, from stations.js). Each area returns [name, registered, stations, geo key].
function streamsOf(centres) {
  return centres.flatMap(([code, cname, streams]) => streams.map((v, i) => ({ code:code + String(i + 1).padStart(2, '0'), name:streams.length > 1 ? `${cname}, stream ${i + 1}` : cname, reg:v, centre:cname })));
}
function areaDefs() {
  const sum = (sts) => sts.reduce((a, x) => a + x.reg, 0);
  if (SEAT === 'mp') return NRB.filter(w => w.k === 280).map(w => { const st = streamsOf(w.c); return [w.wn, sum(st), st, w.g]; });
  if (SEAT === 'mca') return NRB.find(w => w.k === 280 && w.g === 'CLAYCITY').c.map(c => { const st = streamsOf([c]); return [c[1], sum(st), st, null]; });
  const by = new Map();
  NRB.forEach(w => { if (!by.has(w.k)) by.set(w.k, { name:w.cn, centres:[] }); by.get(w.k).centres.push(...w.c); });
  return [...by.entries()].sort((x, y) => x[0] - y[0]).map(([k, v]) => { const st = streamsOf(v.centres); return [v.name, sum(st), st, k]; });
}

function seed() {
  let s = 20270810 + Object.keys(SEATS).indexOf(SEAT) * 7919;
  const rnd = () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648;
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const k1000 = (x) => Math.max(1000, Math.round(x / 1000) * 1000);
  const defs = areaDefs();

  const wards = defs.map(([name, reg, , geo], i) => ({ id:'w' + i, name, reg, geo, share:0.55, weekly:Math.max(100, Math.round(reg * 0.035 / 50) * 50) }));
  const stations = [];
  defs.forEach(([, , sts], wi) => sts.forEach((st) => {
    stations.push({ id:'s' + stations.length, ward:wards[wi].id, code:st.code, name:st.name, reg:st.reg, centre:st.centre });
  }));

  const first = ['Peter','Mercy','Kevin','Faith','Brian','Joyce','Dennis','Wanjiru','Collins','Aisha','Samuel','Lilian','Victor','Nyambura','Hassan','Esther','Moses','Cynthia','Ian','Akinyi'];
  const last = ['Kamau','Otieno','Mutua','Wanjiku','Kiprop','Njoroge','Achieng','Mwangi','Odhiambo','Chebet','Kariuki','Omondi','Wairimu','Barasa','Nduta'];
  const members = [
    { id:'m0', name:CFG.candidate, role:'owner', ward:null, phone:'0712 000 101' },
    { id:'m1', name:'Daniel Muriuki', role:'manager', ward:null, phone:'0712 000 102' },
    { id:'m2', name:'Grace Achieng', role:'finance', ward:null, phone:'0712 000 103' },
    { id:'m3', name:'Faith Njeri', role:'clerk', ward:null, phone:'0712 000 104' },
    { id:'m4', name:'Brian Ouma', role:'clerk', ward:null, phone:'0712 000 105' },
  ];
  const perArea = CFG.county ? 3 : SEAT === 'mca' ? 3 : 4;
  wards.forEach((w, wi) => {
    members.push({ id:`c${wi}`, name:wi === 0 ? 'Peter Kamau' : `${pick(first)} ${pick(last)}`, role:'coordinator', ward:w.id, phone:`0722 ${100 + wi} ${200 + wi}` });
    for (let k = 0; k < perArea; k++) members.push({ id:`a${wi}_${k}`, name:`${pick(first)} ${pick(last)}`, role:'agent', ward:w.id, phone:`07${Math.floor(10 + rnd() * 89)} ${Math.floor(100 + rnd() * 899)} ${Math.floor(100 + rnd() * 899)}` });
  });

  const now = Date.now();
  const activities = [];
  const effort = [1.1, 0.8, 1.0, 0.55, 0.9, 0.7, 1.2]; // areas differ so the leaderboard tells a story
  members.filter(m => m.role === 'agent' || m.role === 'coordinator').forEach(m => {
    const wi = wards.findIndex(w => w.id === m.ward);
    const n = Math.round((6 + rnd() * 10) * effort[wi % effort.length]);
    for (let k = 0; k < n; k++) {
      const kind = pick(['door_to_door','door_to_door','door_to_door','meeting','recruitment','rally']);
      const base = { door_to_door:35, meeting:60, recruitment:8, rally:400 }[kind];
      activities.push({ id:'x' + activities.length, member:m.id, ward:m.ward, kind, reached:base * (0.5 + rnd()), notes:'', at:now - Math.floor(rnd() * 21 * 864e5), source: rnd() < 0.7 ? 'telegram' : 'web' });
    }
  });
  // Scale outreach so the campaign is roughly a third of the way to its vote target, whatever the seat size
  const tgt = wards.reduce((a, w) => a + w.reg * 0.65 * w.share, 0);
  const got = activities.reduce((a, x) => a + x.reached, 0);
  activities.forEach(x => x.reached = Math.max(1, Math.round(x.reached * 0.33 * tgt / got)));
  activities.sort((a, b) => b.at - a.at);
  activities[0].notes = 'Estate WhatsApp group admins on board';
  activities[1].notes = 'Boda boda stage chairmen meeting';

  // Budget lines: item × quantity × unit cost, per area or campaign-wide
  const budgets = [];
  const line = (ward, cat, item, qty, unitLabel, unit) => budgets.push({ id:'b' + budgets.length, ward, cat, item, qty, unitLabel, unit, amount:qty * unit });
  const weeks = SEAT === 'mca' ? 8 : 12;
  wards.forEach((w) => {
    line(w.id, 'agent_stipends', 'Agent weekly stipends', perArea * weeks, 'agent-week', 4500);
    line(w.id, 'transport', 'Agent transport and fare', weeks, 'week', SEAT === 'mca' ? 3000 : 8000);
    line(w.id, 'materials', 'Branded T-shirts and caps', SEAT === 'mca' ? 80 : 200, 'piece', 450);
  });
  line(null, 'media', 'Posters and flyers', k1000(30000 * CFG.scale), 'piece', 12);
  line(null, 'media', 'Vernacular FM radio spots', Math.max(4, Math.round(16 * CFG.scale)), 'spot', 6000);
  line(null, 'venues', 'Rallies: venue, PA and tent', Math.max(2, Math.round(5 * CFG.scale)), 'rally', 45000);
  line(null, 'meals', 'Team meals on rally days', Math.max(2, Math.round(5 * CFG.scale)), 'rally', 15000);

  const payees = members.filter(m => m.role === 'agent' || m.role === 'coordinator').map(m => ({ id:'p' + m.id, kind:'member', member:m.id, name:m.name }));
  payees.push({ id:'pv1', kind:'vendor', member:null, name:'Printex Graphics Ltd' });
  payees.push({ id:'pv2', kind:'vendor', member:null, name:'Nairobi PA Hire' });
  payees.push({ id:'pv3', kind:'vendor', member:null, name:'City Matatu Sacco' });

  const disb = [];
  const add = (o) => disb.push({ id:'d' + (disb.length + 1), at: now - (12 - disb.length) * 864e5, ...o });
  const bw = (wi, cat) => budgets.find(b => b.ward === wards[wi].id && b.cat === cat).id;
  const bc = (cat) => budgets.find(b => !b.ward && b.cat === cat).id;
  const A = (i) => wards[i].name;
  const sc = (x) => Math.round(x * Math.max(0.4, Math.min(CFG.scale, 3)) / 500) * 500;
  add({ budget:bw(0,'agent_stipends'), payee:'pa0_0', amount:4500, purpose:`Weekly stipend, ${A(0)} agent`, status:'paid', by:'c0', decided:'m2', mpesa:'SKL4H2P9QA' });
  add({ budget:bw(1,'transport'), payee:'pv3', amount:sc(18000), purpose:`Matatu hire for ${A(1)} town hall`, status:'paid', by:'c1', decided:'m2', mpesa:'SKM7J1D3RT' });
  add({ budget:bc('media'), payee:'pv1', amount:sc(85000), purpose:'Posters and flyers, batch 1', status:'paid', by:'m1', decided:'m2', mpesa:'SKN2C8W5LB' });
  add({ budget:bw(3,'materials'), payee:'pv1', amount:sc(24000), purpose:`T-shirts for ${A(3)} agents`, status:'approved', by:'c3', decided:'m2' });
  add({ budget:bw(4,'transport'), payee:'pc4', amount:6000, purpose:`Fuel for ${A(4)} door-to-door`, status:'rejected', by:'c4', decided:'m2' });
  add({ budget:bc('venues'), payee:'pv2', amount:sc(45000), purpose:'PA system for the main rally', status:'requested', by:'m1' });
  add({ budget:bw(0,'transport'), payee:'pa0_1', amount:3500, purpose:`Fare for ${A(0)} agents, Saturday`, status:'requested', by:'c0' });
  add({ budget:bw(2,'agent_stipends'), payee:'pa2_0', amount:4500, purpose:`Weekly stipend, ${A(2)} agent`, status:'requested', by:'c2' });

  // Election day: Form 34A per polling station, in a shuffled order so every area has some of each status
  const cands = [
    { id:'k1', name:CFG.candidate, party:'Independent', ours:true },
    { id:'k2', name:'Candidate B', party:'Party B', ours:false },
    { id:'k3', name:'Candidate C', party:'Party C', ours:false },
  ];
  const N = stations.length;
  const order = stations.map((_, i) => [rnd(), i]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  const rank = []; order.forEach((i, r) => rank[i] = r);
  const forms = [];
  stations.forEach((st, i) => {
    const turnout = Math.round(st.reg * (0.55 + rnd() * 0.15));
    const a = Math.round(turnout * (0.42 + rnd() * 0.18)), b = Math.round(turnout * (0.25 + rnd() * 0.12));
    const rej = Math.floor(rnd() * 12);
    const c = Math.max(0, turnout - a - b - rej);
    const truth = { k1:a, k2:b, k3:c };
    const r = rank[i];
    let status, entries = [];
    if (r < Math.round(N * 0.55)) { status = 'confirmed'; entries = [{ by:'m3', votes:{...truth}, rej }, { by:'m4', votes:{...truth}, rej }]; }
    else if (r === Math.round(N * 0.55)) { status = 'disputed'; entries = [{ by:'m3', votes:{...truth}, rej }, { by:'m4', votes:{ ...truth, k1: truth.k1 - 100 }, rej }]; }
    else if (r < Math.round(N * 0.72)) { status = 'awaiting'; entries = [{ by:'m3', votes:{...truth}, rej }]; }
    else if (r < Math.round(N * 0.88)) { status = 'awaiting'; entries = []; }
    else { status = 'not_uploaded'; }
    const wi = wards.findIndex(w => w.id === st.ward);
    forms.push({ id:'f' + i, station:st.id, truth, rej, status, entries, final: status === 'confirmed' ? { votes:{...truth}, rej } : null, uploadedBy: status === 'not_uploaded' ? null : `a${wi}_0` });
  });

  const audit = [
    { at: now - 3 * 864e5, who:'Grace Achieng', what:'Marked disbursement D3 as paid (M-Pesa SKN2C8W5LB)' },
    { at: now - 2 * 864e5, who:'Grace Achieng', what:`Rejected disbursement D5: fuel already covered by the Sacco hire` },
    { at: now - 864e5, who:'Grace Achieng', what:`Approved disbursement D4 (${'KES ' + new Intl.NumberFormat('en-KE').format(sc(24000))})` },
  ];

  return { me:'m0', turnout:0.65, defaultShare:0.55, agentGoal:150, wards, stations, members, activities, budgets, payees, disb, cands, forms, audit };
}

const keyFor = (seat) => 'kampein_demo_v6_' + seat;
let S, PRISTINE;
// Stations and the seeded election-day forms are rebuilt from the IEBC file on load;
// only forms someone has changed are saved, so even a county seat (3,643 stations) stays small.
function load() {
  applySeat();
  const base = seed();
  PRISTINE = base.forms.map(f => ({ status:f.status, n:f.entries.length, fin:JSON.stringify(f.final) }));
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(keyFor(SEAT))); } catch {}
  if (!saved || !saved.formDiff) { S = base; return; }
  const diff = saved.formDiff; delete saved.formDiff;
  S = { ...saved, stations:base.stations, forms:base.forms.map(f => diff[f.id] ? { ...f, ...diff[f.id] } : f) };
}
load();
const save = () => {
  const formDiff = {};
  S.forms.forEach((f, i) => {
    const b = PRISTINE[i];
    if (!b || f.status !== b.status || f.entries.length !== b.n || JSON.stringify(f.final) !== b.fin) formDiff[f.id] = { status:f.status, entries:f.entries, final:f.final };
  });
  const { stations, forms, ...rest } = S;
  try { localStorage.setItem(keyFor(SEAT), JSON.stringify({ ...rest, formDiff })); } catch {}
};
function resetDemo() { try { localStorage.removeItem(keyFor(SEAT)); } catch {} load(); M.level = null; M.sel = null; render(); toast('Demo reset to sample data'); }
function switchSeat(k) {
  save(); SEAT = k;
  try { localStorage.setItem('kampein_demo_seat', k); } catch {}
  load(); M.level = null; M.sel = null;
  const ok = allowedPages();
  if (!ok.includes(location.hash.slice(1))) location.hash = ok[0];
  render();
  toast(`Now showing the ${CFG.seat} demo: ${CFG.name}, ${CFG.where}`);
}

const me = () => S.members.find(m => m.id === S.me);
const member = (id) => S.members.find(m => m.id === id);
const ward = (id) => S.wards.find(w => w.id === id);
const station = (id) => S.stations.find(s => s.id === id);
const isLead = () => ['owner','manager','finance'].includes(me().role);
const nf = new Intl.NumberFormat('en-KE');
const num = (n) => nf.format(Math.round(n || 0));
const kes = (n) => 'KES ' + nf.format(n || 0);
const pct = (a, b) => b > 0 ? Math.min(100, Math.round(a / b * 100)) : 0;
const when = (t) => new Date(t).toLocaleString('en-KE', { timeZone:'Africa/Nairobi', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
// Votes we need in a ward = IEBC registered voters × expected turnout × our target share of votes cast
const target = (w) => Math.round(w.reg * S.turnout * w.share);
const myWard = () => me().ward;
const visibleWards = () => me().role === 'coordinator' ? S.wards.filter(w => w.id === myWard()) : S.wards;
function log(what) { S.audit.unshift({ at:Date.now(), who:me().name, what }); }

let tt;
function toast(msg, err) {
  const el = document.getElementById('toast');
  el.innerHTML = `<div class="toast ${err ? 'err' : ''}">${esc(msg)}</div>`;
  clearTimeout(tt); tt = setTimeout(() => el.innerHTML = '', 3800);
}
function fail(msg) { toast(msg, true); return false; }

function badge(p) {
  if (p === 'money' && ['owner','finance'].includes(me().role)) {
    const n = S.disb.filter(d => d.status === 'requested' && d.by !== S.me).length;
    return n ? `<span class="badge">${n}</span>` : '';
  }
  if (p === 'tally') {
    if (me().role === 'clerk') {
      const n = S.forms.filter(f => f.status === 'awaiting' && !f.entries.some(e => e.by === S.me)).length;
      return n ? `<span class="badge">${n}</span>` : '';
    }
    if (['owner','manager'].includes(me().role)) {
      const n = S.forms.filter(f => f.status === 'disputed').length;
      return n ? `<span class="badge">${n}</span>` : '';
    }
  }
  return '';
}

function render() {
  document.getElementById('camp').innerHTML = `${esc(CFG.name)}<small>${esc(CFG.seat)} · ${esc(CFG.where)}</small>`;
  document.getElementById('seat').innerHTML = Object.entries(SEATS).map(([k, c]) => `<option value="${k}" ${k === SEAT ? 'selected' : ''}>${esc(c.seat)} — ${esc(c.where)}</option>`).join('');
  document.getElementById('who').innerHTML = USERS().map(([id, l]) => `<option value="${id}" ${id === S.me ? 'selected' : ''}>${esc(l)}</option>`).join('');
  const page = current();
  document.getElementById('nav').innerHTML = allowedPages().map(p => `<a href="#${p}" class="${p === page ? 'on' : ''}">${p === 'wards' ? CFG.areas + ' & stations' : PAGES[p].label}${badge(p)}</a>`).join('');
  const y = window.scrollY, same = render.last === page;
  document.getElementById('main').innerHTML = VIEWS[page]();
  window.scrollTo(0, same ? y : 0);
  render.last = page;
}

function header(title, sub) { return `<h1>${title}</h1><p class="sub">${sub || ''}</p>`; }
function stat(l, v, h) { return `<div class="card stat"><div class="l">${l}</div><div class="v">${v}</div>${h ? `<div class="h">${h}</div>` : ''}</div>`; }
function progressRow(label, right, value, cls) { return `<div style="margin-bottom:14px"><div class="row"><span><b>${label}</b></span><span class="muted">${right}</span></div><div class="bar ${cls || ''}"><i style="width:${value}%"></i></div></div>`; }

function wardStats(w) {
  const acts = S.activities.filter(a => a.ward === w.id);
  const week = Date.now() - 7 * 864e5;
  return { reached: acts.reduce((s, a) => s + a.reached, 0), count: acts.length, week: acts.filter(a => a.at > week).length };
}

        <div class="f wide"><label>Who</label><select name="member">${people.map(m => `<option value="${m.id}" ${m.id === S.me ? 'selected' : ''}>${esc(m.name)} (${esc(ward(m.ward).name)})</option>`).join('')}</select></div>
        <div class="f"><label>Activity</label><select name="kind">${Object.entries(KIND_LABEL).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></div>
        <div class="f"><label>People reached</label><input name="reached" type="number" min="0" value="30"></div>
        <div class="f wide"><label>Notes</label><input name="notes" placeholder="Optional"></div>

      <div class="card tablecard"><table class="stack"><thead><tr><th>When</th><th>Who</th><th>${CFG.area}</th><th>Activity</th><th class="r">Reached</th><th>Via</th><th>Notes</th></tr></thead><tbody>

          ${wards.map((x, i) => progressRow(`<span class="rank">${i + 1}</span>${esc(x.w.name)}${x.w.id === myWard() ? ' <span class="pill p-ok">You</span>' : ''}`, `${x.score}% of target`, x.score)).join('')}

          ${people.map((p, i) => `<tr><td class="muted">${i + 1}</td><td><b>${esc(p.m.name)}</b><div class="muted" style="font-size:12px">${ROLE_LABEL[p.m.role]}</div></td><td>${esc(ward(p.m.ward).name)}</td><td class="r">${num(p.reached)}</td><td style="min-width:120px"><div class="row" style="margin-bottom:3px"><span>${num(p.week)}</span><span class="${p.week >= S.agentGoal ? 'up' : 'muted'}">${pct(p.week, S.agentGoal)}%</span></div><div class="bar"><i style="width:${pct(p.week, S.agentGoal)}%"></i></div></td></tr>`).join('')}
        </tbody></table></div>

  },

  money() {
    const role = me().role, lead = isLead(), coord = role === 'coordinator';
    const canDecide = ['owner','finance'].includes(role);
    const budgets = S.budgets.filter(b => !coord || b.ward === myWard());
    const disb = S.disb.filter(d => lead || d.by === S.me).slice().reverse();
    const used = committed;
    const payees = S.payees.filter(p => !coord || p.kind === 'vendor' || member(p.member).ward === myWard());
    const label = budgetLabel;
    const pill = { requested:'<span class="pill p-req">Awaiting approval</span>', approved:'<span class="pill p-ok">Approved</span>', paid:'<span class="pill p-paid">Paid</span>', rejected:'<span class="pill p-no">Rejected</span>' };
    return header('Payments', 'Every shilling requested against a budget line, approved, and paid to a named person or vendor.') + `
      <div class="note">Payments only go to registered team members and vendors. Kampein has no way to record payments to voters, by design.</div>
      ${role !== 'finance' && role !== 'owner' ? `<form class="card inline" style="grid-template-columns:1.6fr 1.6fr 1fr 2fr auto;margin-bottom:16px" onsubmit="return requestMoney(this)">
        <div class="f wide"><label>Budget line</label><select name="budget">${budgets.map(b => `<option value="${b.id}">${esc(label(b))} (KES ${num(b.amount - used(b))} left)</option>`).join('')}</select></div>
        <div class="f wide"><label>Pay to</label><select name="payee">${payees.map(p => `<option value="${p.id}">${esc(p.name)}${p.kind === 'vendor' ? ' (vendor)' : ''}</option>`).join('')}</select></div>
        <div class="f"><label>Amount (KES)</label><input name="amount" type="number" min="1" required></div>
        <div class="f wide"><label>Purpose</label><input name="purpose" required placeholder="What is it for?"></div>
        <button class="btn">Request</button></form>` : ''}
      <h2>Requests and payments</h2>
      <div class="card tablecard"><table class="stack"><thead><tr><th>Ref</th><th>Purpose</th><th>Pay to</th><th class="r">Amount</th><th>Requested by</th><th>Status</th><th></th></tr></thead><tbody>
      ${disb.map(d => {
        const p = S.payees.find(x => x.id === d.payee), b = S.budgets.find(x => x.id === d.budget);
        let act = '';
        if (canDecide && d.status === 'requested') act = d.by === S.me ? '<span class="muted" style="font-size:12px">Needs someone else to approve</span>' : `<button class="btn sm" onclick="decide('${d.id}','approved')">Approve</button> <button class="btn sm danger" onclick="decide('${d.id}','rejected')">Reject</button>`;
        if (canDecide && d.status === 'approved') act = paying === d.id
          ? `<span style="display:inline-flex;gap:6px"><input id="mpesa-ref" placeholder="M-Pesa ref" style="width:120px;border:1px solid var(--z300);border-radius:6px;padding:5px 8px;font-size:12px;text-transform:uppercase"><button class="btn sm" onclick="markPaid('${d.id}')">Save</button></span>`
          : `<button class="btn sm ghost" onclick="paying='${d.id}';render();document.getElementById('mpesa-ref').focus()">Mark paid</button>`;
        if (d.status === 'paid') act = `<span class="muted" style="font-size:12px">M-Pesa ${esc(d.mpesa)}</span>`;
        return `<tr><td data-label="Ref" class="muted">${d.id.toUpperCase()}</td><td data-label="Purpose"><span>${esc(d.purpose)}<div class="muted" style="font-size:12px">${esc(label(b))}</div></span></td><td data-label="Pay to">${esc(p.name)}</td><td data-label="Amount (KES)" class="r"><b>${num(d.amount)}</b></td><td data-label="Requested by">${esc(member(d.by).name)}</td><td data-label="Status"><span>${pill[d.status]}${d.decided ? `<div class="muted" style="font-size:11px;margin-top:3px">by ${esc(member(d.decided).name)}</div>` : ''}</span></td><td data-label="" style="white-space:nowrap">${act}</td></tr>`;
      }).join('') || '<tr><td colspan="7" class="muted">No requests yet.</td></tr>'}
      </tbody></table></div>
      <div class="rule">Requests can't exceed what's left on a budget line. Amounts can't be changed after a request. Nobody approves their own request. "Paid" needs an M-Pesa reference. Payment records can't be deleted.</div>
      <p class="muted" style="font-size:13px;margin-top:14px">Budget lines are set up on the <a href="#budget" style="color:var(--g600)">Budget</a> page.</p>`;
  },

  tally() {
    const role = me().role;
    const reported = S.forms.filter(f => f.status === 'confirmed');
    const totals = Object.fromEntries(S.cands.map(c => [c.id, reported.reduce((s, f) => s + (f.final.votes[c.id] || 0), 0)]));
    const valid = Object.values(totals).reduce((a, b) => a + b, 0);
    const banner = `<div class="note warn">This is the campaign's internal tally, built from Form 34A photos sent by our agents. It is not a result. IEBC alone declares results.</div>`;

    if (role === 'clerk') {
      const queue = S.forms.filter(f => f.status === 'awaiting' && !f.entries.some(e => e.by === S.me));
      const f = queue[0];
      return header('Election day: data entry', `${queue.length} form${queue.length === 1 ? '' : 's'} waiting for your entry`) + banner + (f ? `
        <div class="grid g2">
          <div>${form34(f)}</div>
          <form class="card" onsubmit="return enterTally(this,'${f.id}')">
            <h2 style="margin-top:0">Type what the form shows</h2>
            <p class="muted" style="margin-top:-4px">${esc(station(f.station).name)} · ${esc(ward(station(f.station).ward).name)}. Another clerk enters the same form separately; the two must match.</p>
            ${S.cands.map(c => `<div class="f" style="margin-bottom:10px"><label>${esc(c.name)} (${esc(c.party)})</label><input name="${c.id}" type="number" min="0" required inputmode="numeric"></div>`).join('')}
            <div class="f" style="margin-bottom:14px"><label>Rejected ballots</label><input name="rej" type="number" min="0" required inputmode="numeric"></div>
            <button class="btn">Submit entry</button>

    const disputed = S.forms.filter(f => f.status === 'disputed');
    const canResolve = ['owner','manager'].includes(role);
    const fs = role === 'coordinator' ? S.forms.filter(f => station(f.station).ward === myWard()) : S.forms;
    const statusPill = { confirmed:'<span class="pill p-ok">Confirmed</span>', disputed:'<span class="pill p-no">Entries differ</span>', awaiting:'<span class="pill p-req">Being entered</span>', not_uploaded:'<span class="pill p-wait">Not yet uploaded</span>' };
    return header('Election day: tallying centre', `${reported.length} of ${S.forms.length} polling stations confirmed`) + banner + `
      <div class="grid g3">
        ${S.cands.map(c => stat(`${esc(c.name)}${c.ours ? ' (us)' : ''}`, num(totals[c.id]), `${pct(totals[c.id], valid)}% of confirmed valid votes`)).join('')}
      </div>
      <div class="card" style="margin-top:14px">
        ${S.cands.map(c => progressRow(esc(c.name), `${num(totals[c.id])} votes`, pct(totals[c.id], valid), c.ours ? 'ours' : 'them')).join('')}
        <div class="muted" style="font-size:12px">Stations reporting: ${reported.length}/${S.forms.length}. Totals include confirmed forms only.</div>
      </div>
      ${disputed.length && canResolve ? `<h2>Needs your decision</h2>${disputed.map(f => disputeCard(f)).join('')}` : ''}
      ${fs.length > 120 ? tallyByArea(fs) : `<h2>Polling stations</h2>
      <div class="card tablecard"><table><thead><tr><th>Station</th><th>${CFG.area}</th><th>Status</th><th class="r">Entries</th>${S.cands.map(c => `<th class="r">${esc(c.name.split(' ')[0])}</th>`).join('')}</tr></thead><tbody>
      ${fs.map(f => { const st = station(f.station); return `<tr><td>${esc(st.name)}</td><td>${esc(ward(st.ward).name)}</td><td>${statusPill[f.status]}</td><td class="r muted">${f.entries.length}/2</td>${S.cands.map(c => `<td class="r">${f.final ? num(f.final.votes[c.id]) : '<span class="muted">—</span>'}</td>`).join('')}</tr>`; }).join('')}
      </tbody></table></div>`}
      <div class="rule">Each form is typed in by two different clerks. Matching entries confirm the station; differences go to the campaign manager with the photo.</div>`;

  audit() {
    return header('Audit log', 'Every money and tally action, who did it and when. Entries can\'t be edited or deleted.') + `
      <div class="card tablecard"><table><thead><tr><th>When</th><th>Who</th><th>What</th></tr></thead><tbody>
      ${S.audit.map(a => `<tr><td class="muted" style="white-space:nowrap">${when(a.at)}</td><td>${esc(a.who)}</td><td>${esc(a.what)}</td></tr>`).join('')}
      </tbody></table></div>`;
  },
};


// ---------------------------------------------------------------------------
// Map: Kenya counties -> Nairobi constituencies -> Kasarani wards
// County seats work at constituency level; MP at ward level; MCA inside Clay City ward.
// ---------------------------------------------------------------------------
const REG22 = GEO.counties.reduce((a, c) => a + c.reg, 0);
const NEW26 = GEO.counties.reduce((a, c) => a + c.new26, 0);
let M = { level:null, sel:null, layer:'reg' };
const opLevel = () => CFG.county ? 'nairobi' : 'kasarani';
const areaByGeo = (k) => S.wards.find(w => w.geo != null && String(w.geo) === String(k));

function mix(a, b, t) {
  const h = (x) => [1, 3, 5].map(i => parseInt(x.slice(i, i + 2), 16));
  const [A, B] = [h(a), h(b)];
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
function ramp(t) { // dark green -> mint -> sun
  t = Math.max(0, Math.min(1, t));
  return t < 0.6 ? mix('#1d5a37', '#5fd394', t / 0.6) : mix('#5fd394', '#f7e98e', (t - 0.6) / 0.4);
}
const RAMP_CSS = 'linear-gradient(90deg,#1d5a37,#5fd394 60%,#f7e98e)';
const GREY = '#2c4a39';

function countyVal(c) { return M.layer === 'reg' ? c.reg : M.layer === 'new' ? c.new26 : c.new26 / c.reg; }
function scaled(vals) { // colour by rank so one giant (Nairobi) doesn't flatten everything else
  const sorted = vals.slice().sort((a, b) => a - b);
  return (v) => sorted.indexOf(v) / ((sorted.length - 1) || 1);
}
function areaInfo(w) {
  const st = wardStats(w);
  return { w, st, p:pct(st.reached, target(w)),
    agents:S.members.filter(m => m.ward === w.id && m.role === 'agent').length,
    stations:S.stations.filter(x => x.ward === w.id).length };
}
function campaignP() {
  const t = S.wards.reduce((a, w) => a + target(w), 0), r = S.wards.reduce((a, w) => a + wardStats(w).reached, 0);
  return pct(r, t);
}
const fmtPct = (x, d = 1) => (x * 100).toFixed(d) + '%';
const parseKey = (k) => M.level === 'kasarani' ? k : +k;

function mapGo(level, sel) { M.level = level; M.sel = sel ?? null; render(); }
function mapLayer(l) { M.layer = l; render(); }
function rings(c, label, dy) {
  return `<circle class="ring" cx="${c[0]}" cy="${c[1]}" r="6"/><circle class="ring b" cx="${c[0]}" cy="${c[1]}" r="6"/>` +
    (label ? `<text class="tag" x="${c[0]}" y="${c[1] + (dy || -16)}" text-anchor="middle">${label}</text>` : '');
}
function dotsFor(geoKey, n) {
  return (GEO.map.kasarani.pts[geoKey] || []).slice(0, n).map((p, i) => `<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="2.6" style="animation-delay:${((i * 0.37) % 2.6).toFixed(2)}s"/>`).join('');
}

function mapSVG() {
  const L = M.level, g = GEO.map[L];
  const week = Date.now() - 7 * 864e5;
  let paths = '', extra = '';
  if (L === 'kenya') {
    const f = scaled(GEO.counties.map(countyVal));
    paths = g.items.map(it => {
      const c = GEO.counties.find(x => x.code === it.key);
      return `<path class="rg ${it.key === 47 ? 'camp' : ''} ${M.sel === it.key ? 'sel' : ''}" data-k="${it.key}" d="${it.d}" fill="${ramp(f(countyVal(c)))}"><title>${esc(c.name)}</title></path>`;
    }).join('');
    const nb = g.items.find(i => i.key === 47).c;
    extra = rings(nb) + `<circle class="core" cx="${nb[0]}" cy="${nb[1]}" r="3.5"/><text class="tag" x="${nb[0] + 16}" y="${nb[1] + 4}">YOUR CAMPAIGN</text>`;
  } else if (L === 'nairobi' && CFG.county) {
    paths = g.items.map(it => {
      const w = areaByGeo(it.key), info = areaInfo(w);
      const mine = me().role === 'coordinator' && w.id === myWard();
      return `<path class="rg ${mine ? 'camp' : ''} ${M.sel === it.key ? 'sel' : ''}" data-k="${it.key}" d="${it.d}" fill="${ramp(info.p / 100)}"><title>${esc(w.name)}: ${info.p}% of target</title></path>`;
    }).join('');
    extra = g.items.filter(it => it.key === M.sel).map(it => { const w = areaByGeo(it.key); return `<text class="lbl" x="${it.c[0]}" y="${it.c[1] - 4}" text-anchor="middle">${esc(w.name)}</text><text class="lbl2" x="${it.c[0]}" y="${it.c[1] + 13}" text-anchor="middle">${areaInfo(w).p}% of target</text>`; }).join('');
  } else if (L === 'nairobi') {
    const f = scaled(GEO.consts.map(c => c.reg));
    paths = g.items.map(it => {
      const c = GEO.consts.find(x => x.code === it.key);
      return `<path class="rg ${it.key === 280 ? 'camp' : ''} ${M.sel === it.key ? 'sel' : ''}" data-k="${it.key}" d="${it.d}" fill="${ramp(f(c.reg))}"><title>${esc(c.name)}</title></path>`;
    }).join('');
    extra = rings(g.items.find(i => i.key === 280).c, 'KASARANI');
  } else if (SEAT === 'mca') {
    const p = campaignP();
    paths = g.items.map(it => {
      const ours = it.key === 'CLAYCITY';
      return `<path class="rg ${ours ? 'camp' : ''}" data-k="${it.key}" d="${it.d}" fill="${ours ? ramp(p / 100) : GREY}" style="${ours ? '' : 'opacity:.55;cursor:default'}"><title>${ours ? 'Clay City' : 'Outside the ward'}</title></path>`;
    }).join('');
    const n = Math.min(40, S.activities.filter(a => a.at > week).length);
    const cc = g.items.find(i => i.key === 'CLAYCITY').c;
    extra = dotsFor('CLAYCITY', n) + g.items.filter(it => it.key !== 'CLAYCITY').map(it => `<text class="lbl" style="opacity:.45;font-size:12px" x="${it.c[0]}" y="${it.c[1]}" text-anchor="middle">${esc(it.key === 'CLAYCITY' ? '' : it.key[0] + it.key.slice(1).toLowerCase())}</text>`).join('')
      + `<text class="lbl" x="${cc[0] + 10}" y="${cc[1] - 34}" text-anchor="middle">Clay City</text><text class="lbl2" x="${cc[0] + 10}" y="${cc[1] - 17}" text-anchor="middle">${p}% of target</text>`;
  } else {
    paths = g.items.map(it => {
      const w = areaByGeo(it.key), info = areaInfo(w);
      const mine = me().role === 'coordinator' && w.id === myWard();
      return `<path class="rg ${mine ? 'camp' : ''} ${M.sel === it.key ? 'sel' : ''}" data-k="${it.key}" d="${it.d}" fill="${ramp(info.p / 100)}"><title>${esc(w.name)}</title></path>`;
    }).join('');
    extra = g.items.map(it => {
      const w = areaByGeo(it.key);
      return dotsFor(it.key, Math.min(40, S.activities.filter(a => a.ward === w.id && a.at > week).length * 2));
    }).join('') + g.items.map(it => {
      const info = areaInfo(areaByGeo(it.key));
      const [dx, dy] = { CLAYCITY:[10, -30], KASARANI:[-20, 30] }[it.key] || [0, 0];
      const x = it.c[0] + dx, y = it.c[1] + dy;
      return `<text class="lbl" x="${x}" y="${y - 4}" text-anchor="middle">${esc(info.w.name)}</text><text class="lbl2" x="${x}" y="${y + 13}" text-anchor="middle">${info.p}% of target</text>`;
    }).join('');
  }
  return `<svg class="kmap" viewBox="0 0 ${g.w} ${g.h}" onclick="mapClick(event)" onmouseover="mapHover(event)"><g class="lvl">${paths}${extra}</g></svg>`;
}

function mapHover(e) {
  if (!matchMedia('(hover: hover)').matches) return;
  const k = e.target.dataset?.k; if (!k || (SEAT === 'mca' && M.level === 'kasarani')) return;
  const key = parseKey(k);
  if (key === M.sel) return;
  M.sel = key; mapRefresh();
}
function mapClick(e) {
  const k = e.target.dataset?.k; if (!k) return;
  const key = parseKey(k);
  if (M.level === 'kenya' && key === 47 && M.sel === 47) return mapGo('nairobi', CFG.county ? null : 280);
  if (M.level === 'nairobi' && !CFG.county && key === 280 && M.sel === 280) return mapGo('kasarani');
  if (SEAT === 'mca' && M.level === 'kasarani') { M.sel = null; return mapRefresh(); }
  M.sel = key; mapRefresh();
}
function mapRefresh() {
  if (M.level === 'nairobi' && CFG.county) return render(); // label follows the selection
  document.querySelectorAll('.kmap path.rg').forEach(p => p.classList.toggle('sel', String(p.dataset.k) === String(M.sel)));
  document.getElementById('mappanel').innerHTML = mapPanel();
}
function mapPick(k) { M.sel = k; mapRefresh(); }

function listRows(rows, sel) {
  const max = Math.max(...rows.map(r => r.v));
  return `<div class="mlist">${rows.map((r, i) => `<button class="${String(r.k) === String(sel) ? 'sel' : ''}" onclick='mapPick(${JSON.stringify(r.k)})'>
    <span class="muted">${i + 1}</span><span>${esc(r.name)}${r.camp ? ' <span class="pill p-ok">Campaign</span>' : ''}</span><b>${r.label}</b>
    <span class="mb"><i style="width:${(r.v / max * 100).toFixed(1)}%"></i></span></button>`).join('')}</div>`;
}
function areaDetail(info, unit) {
  return `<div class="kicker">${esc(info.w.name)}${unit ? ' ' + unit : ''}</div><div class="big">${info.p}%</div><div class="muted">of vote target reached</div>
    <div class="kv" style="margin-top:12px"><span class="muted">Registered voters${SEAT === 'mca' ? '' : ' (IEBC 2022)'}</span><b>${num(info.w.reg)}</b>
    <span class="muted">Vote target</span><b>${num(target(info.w))} <a href="#targets" style="font-size:11px;color:var(--g600)">edit</a></b>
    <span class="muted">People reached</span><b>${num(info.st.reached)}</b>
    <span class="muted">Activities this week</span><b>${info.st.week}</b>
    <span class="muted">Agents · polling stations</span><b>${info.agents} · ${info.stations}</b></div>`;
}

function mapPanel() {
  const L = M.level;
  const src = `<div class="src">Registered voters: IEBC, 2022 register (per constituency and ward). New voters 2026: IEBC ECVR Phase 1 final report, 30 Apr 2026 (per county only). Campaign figures are demo data.</div>`;
  const nb = GEO.counties.find(x => x.code === 47);
  if (L === 'kenya') {
    const sorted = GEO.counties.slice().sort((a, b) => countyVal(b) - countyVal(a));
    const lbl = (c) => M.layer === 'reg' ? num(c.reg) : M.layer === 'new' ? '+' + num(c.new26) : '+' + fmtPct(c.new26 / c.reg);
    const c = GEO.counties.find(x => x.code === M.sel);
    const head = c ? `<div class="kicker">${esc(c.name)} County</div>
        <div class="big">${num(c.reg)}</div><div class="muted">registered voters, 2022</div>
        <div class="kv" style="margin-top:12px"><span class="muted">New voters, 2026 ECVR</span><b class="up">+${num(c.new26)} (${fmtPct(c.new26 / c.reg)})</b>
        <span class="muted">Constituencies</span><b>${c.consts}</b>
        <span class="muted">Rank by voters</span><b>${GEO.counties.slice().sort((a, b) => b.reg - a.reg).findIndex(x => x.code === c.code) + 1} of 47</b>
        <span class="muted">Share of Kenya</span><b>${fmtPct(c.reg / REG22)}</b></div>
        ${c.code === 47 ? `<button class="btn" style="margin-top:14px;width:100%" onclick="mapGo('nairobi',${CFG.county ? 'null' : 280})">Zoom into Nairobi →</button>` : `<p class="muted" style="font-size:12px;margin-top:12px">Kampein loads constituency and ward detail for every county a client campaigns in.</p>`}`
      : `<div class="kicker">Kenya</div><div class="big">${num(REG22)}</div><div class="muted">registered voters, 2022</div>
        <div class="kv" style="margin-top:12px"><span class="muted">New voters, 2026 ECVR</span><b class="up">+${num(NEW26)} (${fmtPct(NEW26 / REG22)})</b>
        <span class="muted">Counties</span><b>47</b><span class="muted">Constituencies</span><b>290</b></div>`;
    const title = { reg:'Most registered voters (2022)', new:'Most new voters (2026)', growth:'Fastest growing register (2026)' }[M.layer];
    return `<div class="card mappanel">${head}<h2>${title}</h2>${listRows(sorted.slice(0, 10).map(x => ({ k:x.code, name:x.name, v:countyVal(x), label:lbl(x), camp:x.code === 47 })), M.sel)}${src}</div>`;
  }
  const note26 = `<div class="note" style="margin:14px 0 0">Nairobi added <b>${num(nb.new26)}</b> new voters in the 2026 drive, the most of any county (+${fmtPct(nb.new26 / nb.reg)}). IEBC has not yet published the split by constituency or ward.</div>`;
  if (L === 'nairobi' && CFG.county) {
    const rows = S.wards.map(w => areaInfo(w)).sort((a, b) => b.p - a.p);
    const sel = rows.find(r => String(r.w.geo) === String(M.sel));
    const head = sel ? areaDetail(sel, 'Constituency')
      : `<div class="kicker">Nairobi County · ${esc(CFG.seat)}</div><div class="big">${campaignP()}%</div><div class="muted">of the county-wide vote target reached</div>
         <div class="kv" style="margin-top:12px"><span class="muted">Registered voters (IEBC 2022)</span><b>${num(nb.reg)}</b><span class="muted">Vote target</span><b>${num(S.wards.reduce((a, w) => a + target(w), 0))}</b></div>
         <p class="muted" style="font-size:12px;margin-top:10px">Each constituency is coloured by progress. Tap one for detail.</p>`;
    return `<div class="card mappanel">${head}${note26}<h2>Constituencies by progress</h2>${listRows(rows.map(r => ({ k:r.w.geo, name:r.w.name, v:r.p || 0.001, label:r.p + '%' })), M.sel)}${src}</div>`;
  }
  if (L === 'nairobi') {
    const sorted = GEO.consts.slice().sort((a, b) => b.reg - a.reg);
    const c = GEO.consts.find(x => x.code === M.sel);
    const head = c ? `<div class="kicker">${esc(c.name)} Constituency</div><div class="big">${num(c.reg)}</div><div class="muted">registered voters, 2022</div>
        <div class="kv" style="margin-top:12px"><span class="muted">Share of Nairobi</span><b>${fmtPct(c.reg / nb.reg)}</b>
        <span class="muted">Rank in Nairobi</span><b>${sorted.findIndex(x => x.code === c.code) + 1} of 17</b></div>
        ${c.code === 280 ? `<button class="btn" style="margin-top:14px;width:100%" onclick="mapGo('kasarani')">Zoom into ${SEAT === 'mca' ? 'Clay City ward' : 'Kasarani wards'} →</button>` : ''}` : '';
    return `<div class="card mappanel">${head}${note26}<h2>Nairobi constituencies (2022)</h2>${listRows(sorted.map(x => ({ k:x.code, name:x.name, v:x.reg, label:num(x.reg), camp:x.code === 280 })), M.sel)}${src}</div>`;
  }
  if (SEAT === 'mca') {
    const rows = S.wards.map(w => areaInfo(w)).sort((a, b) => b.p - a.p);
    const sel = rows.find(r => r.w.id === M.sel);
    const head = sel ? areaDetail(sel, '')
      : `<div class="kicker">Clay City Ward · MCA</div><div class="big">${campaignP()}%</div><div class="muted">of the ward's vote target reached</div>
         <div class="kv" style="margin-top:12px"><span class="muted">Registered voters (IEBC 2022)</span><b>${num(34387)}</b><span class="muted">Vote target</span><b>${num(S.wards.reduce((a, w) => a + target(w), 0))}</b></div>
         <p class="muted" style="font-size:12px;margin-top:10px">Glowing dots are field activity logged this week. Polling centres are listed below.</p>`;
    return `<div class="card mappanel">${head}<h2>Polling centres by progress</h2>${listRows(rows.map(r => ({ k:r.w.id, name:r.w.name, v:r.p || 0.001, label:r.p + '%' })), M.sel)}${src}</div>`;
  }
  const rows = S.wards.map(w => areaInfo(w)).sort((a, b) => b.p - a.p);
  const sel = rows.find(r => r.w.geo === M.sel);
  const head = sel ? areaDetail(sel, 'Ward')
    : `<div class="kicker">Kasarani Constituency</div><div class="big">${num(S.wards.reduce((a, w) => a + w.reg, 0))}</div><div class="muted">registered voters across 5 wards (IEBC 2022)</div>
       <p class="muted" style="font-size:12px;margin-top:10px">Each glowing dot is field activity logged this week. Tap a ward for detail.</p>`;
  return `<div class="card mappanel">${head}<h2>Wards by progress</h2>${listRows(rows.map(r => ({ k:r.w.geo, name:r.w.name, v:r.p || 0.001, label:r.p + '%' })), M.sel)}${src}</div>`;
}

VIEWS.map = function () {
  const coord = me().role === 'coordinator';
  if (!M.level) M.level = coord ? opLevel() : 'kenya';
  if (M.level === 'kasarani' && CFG.county) M.level = 'nairobi';
  if (coord && M.sel == null && M.level === opLevel()) { const w = ward(myWard()); M.sel = SEAT === 'mca' ? w.id : w.geo; }
  const L = M.level;
  const crumb = (lv, name) => `<button class="${L === lv ? 'cur' : ''}" onclick="mapGo('${lv}')">${name}</button>`;
  const opLegend = ['0%', 'People reached as share of vote target', '100%'];

  const crumbs = crumb('kenya', 'Kenya') + '<span>›</span>' + crumb('nairobi', 'Nairobi') + (CFG.county ? '' : '<span>›</span>' + crumb('kasarani', SEAT === 'mca' ? 'Clay City' : 'Kasarani'));

    <div class="mapwrap">

        <div class="maptop">
          <div class="crumbs">${crumbs}</div>
          ${L === 'kenya' ? `<div class="layers">${[['reg', 'Voters 2022'], ['new', 'New 2026'], ['growth', 'Growth']].map(([k, l]) => `<button class="${M.layer === k ? 'on' : ''}" onclick="mapLayer('${k}')">${l}</button>`).join('')}</div>` : ''}
        </div>
        ${mapSVG()}
        <div class="legend"><span>${legend[0]}</span><i style="background:${RAMP_CSS}"></i><span>${legend[2]}</span><span style="margin-left:auto">${legend[1]}</span></div>

};

VIEWS.targets = function () {
  const role = me().role, canEdit = ['owner','manager'].includes(role);
  const ws = visibleWards();
  const week = Date.now() - 7 * 864e5;
  const reg = ws.reduce((a, w) => a + w.reg, 0);
  const cast = Math.round(reg * S.turnout);
  const need = ws.reduce((a, w) => a + target(w), 0);
  const dis = canEdit ? '' : 'disabled';
  const rows = ws.map(w => {
    const st = wardStats(w);
    const wk = S.activities.filter(a => a.ward === w.id && a.at > week).reduce((a, x) => a + x.reached, 0);
    return `<tr>
      <td data-label="${CFG.area}"><b>${esc(w.name)}</b></td>
      <td data-label="Registered" class="r">${num(w.reg)}</td>
      <td data-label="Expected votes cast" class="r muted">${num(w.reg * S.turnout)}</td>
      <td data-label="Our vote share %" class="r"><input class="tin" name="share_${w.id}" type="number" min="0" max="100" step="1" value="${Math.round(w.share * 100)}" ${dis} oninput="previewTarget('${w.id}', this.value)"></td>
      <td data-label="Votes needed" class="r"><b id="tv_${w.id}">${num(target(w))}</b></td>
      <td data-label="Reached so far" class="r"><span>${num(st.reached)} <span class="muted">(${pct(st.reached, target(w))}%)</span></span></td>
      <td data-label="Weekly outreach goal" class="r"><input class="tin" name="weekly_${w.id}" type="number" min="0" step="50" value="${w.weekly}" ${dis}></td>
      <td data-label="This week" style="min-width:130px"><div style="flex:1;max-width:180px"><div class="row" style="margin-bottom:3px"><span>${num(wk)}</span><span class="${wk >= w.weekly ? 'up' : 'muted'}">${pct(wk, w.weekly)}%</span></div><div class="bar"><i style="width:${pct(wk, w.weekly)}%"></i></div></div></td>
    </tr>`;
  }).join('');
  return header('Targets', `How many votes you need in each ${CFG.area.toLowerCase()}, and how much field work it takes each week to get there.`) + `
    <div class="grid g4">
      ${stat('Registered voters', num(reg), 'IEBC 2022 register')}
      ${stat('Expected votes cast', num(cast), `at ${Math.round(S.turnout * 100)}% turnout`)}
      ${stat('Votes we need', num(need), `${pct(need, cast)}% of votes cast`)}
      ${stat('Agent weekly goal', num(S.agentGoal), 'people reached per agent')}
    </div>
    ${canEdit ? `<form class="card inline" style="grid-template-columns:1fr 1fr 1fr auto;margin-top:14px" onsubmit="return saveAssumptions(this)">
      <div class="f"><label>Expected turnout %</label><input name="turnout" type="number" min="1" max="100" value="${Math.round(S.turnout * 100)}"></div>
      <div class="f"><label>Our vote share % (all ${CFG.areas.toLowerCase()})</label><input name="share" type="number" min="1" max="100" value="${Math.round(S.defaultShare * 100)}"></div>
      <div class="f"><label>Each agent reaches, per week</label><input name="agent" type="number" min="0" step="10" value="${S.agentGoal}"></div>
      <button class="btn">Apply to campaign</button>
    </form>
    <div class="rule" style="margin-top:6px">Kenya's 2022 turnout was about 65% nationally; set your own figure for the seat. Applying a vote share resets every ${CFG.area.toLowerCase()} to it; fine-tune them below.</div>` : ''}
    <h2>${CFG.area} targets</h2>
    <form onsubmit="return saveWardTargets(this)">
      <div class="card tablecard"><table class="stack"><thead><tr><th>${CFG.area}</th><th class="r">Registered${CFG.area === 'Polling centre' ? '' : ' (IEBC)'}</th><th class="r">Votes cast (est.)</th><th class="r">Our share %</th><th class="r">Votes needed</th><th class="r">Reached so far</th><th class="r">Weekly goal</th><th>This week</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      ${canEdit ? `<div style="margin-top:12px;display:flex;gap:10px;align-items:center"><button class="btn">Save targets</button><span class="muted" style="font-size:12px">Changes are recorded in the audit log.</span></div>` : `<p class="muted" style="font-size:12px;margin-top:10px">Targets are set by the candidate or campaign manager.</p>`}
    </form>`;
};

function previewTarget(wid, v) {
  const w = ward(wid), el = document.getElementById('tv_' + wid);
  if (el) el.textContent = num(w.reg * S.turnout * Math.min(100, Math.max(0, +v)) / 100);
}
function saveAssumptions(form) {
  const d = new FormData(form);
  const t = Math.min(100, Math.max(1, +d.get('turnout'))) / 100, sh = Math.min(100, Math.max(1, +d.get('share'))) / 100, ag = Math.max(0, +d.get('agent'));
  S.turnout = t; S.defaultShare = sh; S.agentGoal = ag;
  S.wards.forEach(w => w.share = sh);
  log(`Set campaign targets: ${Math.round(t * 100)}% turnout, ${Math.round(sh * 100)}% vote share in all wards, ${num(ag)} people per agent per week`);
  save(); render(); toast('Campaign targets updated'); return false;
}
function saveWardTargets(form) {
  const d = new FormData(form);
  const changes = [];
  S.wards.forEach(w => {
    if (!d.has('share_' + w.id)) return;
    const sh = Math.min(100, Math.max(0, +d.get('share_' + w.id))) / 100, wk = Math.max(0, +d.get('weekly_' + w.id));
    if (sh !== w.share || wk !== w.weekly) changes.push(`${w.name} ${Math.round(sh * 100)}% / ${num(wk)} a week`);
    w.share = sh; w.weekly = wk;
  });
  if (changes.length) log(`Updated ${CFG.area.toLowerCase()} targets: ` + changes.join('; '));
  save(); render(); toast(changes.length ? 'Targets saved' : 'No changes'); return false;
}

// ---------------------------------------------------------------------------
// Budget: line items (quantity × unit cost) per area or campaign-wide
// ---------------------------------------------------------------------------
const committed = (b) => S.disb.filter(d => d.budget === b.id && ['requested','approved','paid'].includes(d.status)).reduce((a, d) => a + d.amount, 0);
const paidOn = (b) => S.disb.filter(d => d.budget === b.id && d.status === 'paid').reduce((a, d) => a + d.amount, 0);
const budgetLabel = (b) => `${b.ward ? ward(b.ward).name : 'Campaign-wide'} · ${b.item || CAT_LABEL[b.cat]}`;
let editingLine = null;
const plural = (w, n) => n === 1 ? w : /[^aeiou]y$/.test(w) ? w.slice(0, -1) + 'ies' : w + 's';

VIEWS.budget = function () {
  const role = me().role, canEdit = ['owner','finance'].includes(role), coord = role === 'coordinator';
  const lines = S.budgets.filter(b => !coord || b.ward === myWard());
  const tot = lines.reduce((a, b) => a + b.amount, 0), com = lines.reduce((a, b) => a + committed(b), 0), paid = lines.reduce((a, b) => a + paidOn(b), 0);
  const groups = [null, ...S.wards.map(w => w.id)].filter(g => lines.some(b => b.ward === g));
  const cats = Object.keys(CAT_LABEL).map(c => ({ c, v:lines.filter(b => b.cat === c).reduce((a, b) => a + b.amount, 0) })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  const row = (b) => {
    const cm = committed(b), left = b.amount - cm;
    const qtyCell = editingLine === b.id
      ? `<span style="display:inline-flex;gap:6px;align-items:center"><input class="tin" id="eq_${b.id}" type="number" min="0" value="${b.qty}"> × <input class="tin" id="eu_${b.id}" type="number" min="0" value="${b.unit}"></span>`
      : `${num(b.qty)} ${esc(plural(b.unitLabel || 'unit', b.qty))} × ${num(b.unit)}`;
    const act = !canEdit ? '' : editingLine === b.id
      ? `<button class="btn sm" onclick="saveLine('${b.id}')">Save</button> <button class="btn sm ghost" onclick="editingLine=null;render()">Cancel</button>`
      : `<button class="btn sm ghost" onclick="editingLine='${b.id}';render()">Edit</button>`;
    return `<tr><td data-label="Item"><span><b>${esc(b.item)}</b><div class="muted" style="font-size:12px">${CAT_LABEL[b.cat]}</div></span></td>
      <td data-label="Quantity × unit cost" class="r">${qtyCell}</td>
      <td data-label="Budget (KES)" class="r"><b>${num(b.amount)}</b></td>
      <td data-label="Committed" class="r">${num(cm)}</td>
      <td data-label="Left" class="r" style="${left <= b.amount * 0.1 ? 'color:var(--red);font-weight:600' : ''}">${num(left)}</td>
      <td data-label="Used" style="min-width:110px"><div class="bar" style="flex:1;max-width:160px;margin-top:5px"><i style="width:${pct(cm, b.amount)}%"></i></div></td>
      <td data-label="" style="white-space:nowrap">${act}</td></tr>`;
  };
  return header('Budget', 'Plan the campaign budget item by item. Every payment request draws against one of these lines.') + `
    <div class="grid g4">
      ${stat('Total budget', kes(tot), `${lines.length} budget lines`)}
      ${stat('Committed', kes(com), `${pct(com, tot)}% requested, approved or paid`)}
      ${stat('Paid out', kes(paid), `${pct(paid, tot)}% of budget`)}
      ${stat('Left to spend', kes(tot - com), 'not yet committed')}
    </div>
    ${canEdit ? `<form class="card inline" style="grid-template-columns:1.8fr 1.2fr 1.3fr .8fr .9fr 1fr auto;margin-top:14px" onsubmit="return addLine(this)" oninput="const f=this;f.querySelector('#nl_total').textContent='KES '+new Intl.NumberFormat('en-KE').format((+f.qty.value||0)*(+f.unit.value||0))">
      <div class="f wide"><label>New budget item</label><input name="item" required placeholder="e.g. Branded umbrellas"></div>
      <div class="f"><label>Category</label><select name="cat">${Object.entries(CAT_LABEL).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></div>
      <div class="f"><label>For</label><select name="ward"><option value="">Whole campaign</option>${S.wards.map(w => `<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div>
      <div class="f"><label>Quantity</label><input name="qty" type="number" min="1" value="1" required></div>
      <div class="f"><label>Unit</label><input name="unitLabel" placeholder="piece" value="piece"></div>
      <div class="f"><label>Unit cost (KES)</label><input name="unit" type="number" min="0" required></div>
      <div style="display:flex;flex-direction:column;gap:4px"><span class="muted" style="font-size:11px" id="nl_total">KES 0</span><button class="btn">Add item</button></div>
    </form>` : ''}
    <div class="grid g2" style="margin-top:14px;align-items:start">
      <div class="card"><h2 style="margin-top:0">By category</h2>
        ${cats.map(x => progressRow(CAT_LABEL[x.c], `${kes(x.v)} · ${pct(x.v, tot)}%`, pct(x.v, cats[0].v))).join('') || '<p class="muted">No budget yet.</p>'}</div>
      <div class="card"><h2 style="margin-top:0">By ${CFG.area.toLowerCase()}</h2>
        ${groups.map(g => { const v = lines.filter(b => b.ward === g).reduce((a, b) => a + b.amount, 0); return `<div class="row"><span>${g ? esc(ward(g).name) : '<b>Campaign-wide</b>'}</span><b>${kes(v)}</b></div>`; }).join('')}</div>
    </div>
    ${groups.map(g => `<h2>${g ? esc(ward(g).name) : 'Campaign-wide'}</h2>
      <div class="card tablecard"><table class="stack"><thead><tr><th>Item</th><th class="r">Quantity × unit cost</th><th class="r">Budget (KES)</th><th class="r">Committed</th><th class="r">Left</th><th>Used</th><th></th></tr></thead>
      <tbody>${lines.filter(b => b.ward === g).map(row).join('')}</tbody></table></div>`).join('')}
    <div class="rule">Only the candidate and finance lead change the budget. A line can't be cut below what's already committed. Every change is in the audit log.</div>`;
};

function addLine(form) {
  const d = new FormData(form);
  const qty = Math.max(1, Math.round(+d.get('qty'))), unit = Math.max(0, Math.round(+d.get('unit')));
  if (!unit) return fail('Enter a unit cost');
  const b = { id:'b' + Date.now(), ward:d.get('ward') || null, cat:d.get('cat'), item:d.get('item').trim(), qty, unitLabel:(d.get('unitLabel') || 'unit').trim(), unit, amount:qty * unit };
  S.budgets.push(b);
  log(`Added budget line "${b.item}" (${b.ward ? ward(b.ward).name : 'campaign-wide'}): ${num(qty)} × ${kes(unit)} = ${kes(b.amount)}`);
  save(); render(); toast(`Added ${b.item}: ${kes(b.amount)}`); return false;
}
function saveLine(id) {
  const b = S.budgets.find(x => x.id === id);
  const qty = Math.max(0, Math.round(+document.getElementById('eq_' + id).value)), unit = Math.max(0, Math.round(+document.getElementById('eu_' + id).value));
  const amount = qty * unit, cm = committed(b);
  if (amount < cm) return fail(`${b.item} already has ${kes(cm)} committed. The budget can't go below that.`);
  log(`Changed budget line "${b.item}": ${kes(b.amount)} → ${kes(amount)} (${num(qty)} × ${kes(unit)})`);
  Object.assign(b, { qty, unit, amount }); editingLine = null;
  save(); render(); toast('Budget line updated');
}

function addWard(form) {
  const d = new FormData(form);
  S.wards.push({ id:'w' + Date.now(), name:d.get('name').trim(), reg:+d.get('reg'), share:Math.min(100, Math.max(0, +d.get('share'))) / 100, weekly:Math.round(+d.get('reg') * 0.035 / 50) * 50 });
  save(); render(); toast('Ward added'); return false;
}
function addMember(form) {
  const d = new FormData(form);
  const role = d.get('role');
  const w = me().role === 'coordinator' ? myWard() : (d.get('ward') || null);
  if (['agent','coordinator'].includes(role) && !w) return fail(`Agents and coordinators need a ${CFG.area.toLowerCase()}`);
  const id = 'n' + Date.now();
  S.members.push({ id, name:d.get('name').trim(), role, ward:w, phone:d.get('phone') });
  if (role === 'agent' || role === 'coordinator') S.payees.push({ id:'p' + id, kind:'member', member:id, name:d.get('name').trim() });
  log(`Added ${d.get('name').trim()} as ${ROLE_LABEL[role]}`);
  save(); render(); toast('Team member added'); return false;
}
function logActivity(form) {
  const d = new FormData(form);
  const m = member(d.get('member'));
  S.activities.unshift({ id:'x' + Date.now(), member:m.id, ward:m.ward, kind:d.get('kind'), reached:Math.max(0, +d.get('reached')), notes:d.get('notes'), at:Date.now(), source:'web' });
  save(); render(); toast('Activity logged. Leaderboard updated.'); return false;
}
function requestMoney(form) {
  const d = new FormData(form);
  const amount = +d.get('amount');
  if (!(amount > 0)) return fail('Enter an amount');
  const bl = S.budgets.find(x => x.id === d.get('budget')), left = bl.amount - committed(bl);
  if (amount > left) return fail(`Only ${kes(left)} is left on "${bl.item}". Ask finance to increase the budget line first.`);
  const n = S.disb.length + 1;
  S.disb.push({ id:'d' + n, at:Date.now(), budget:d.get('budget'), payee:d.get('payee'), amount, purpose:d.get('purpose').trim(), status:'requested', by:S.me });
  log(`Requested D${n}: ${kes(amount)} for "${d.get('purpose').trim()}"`);
  save(); render(); toast('Request sent to finance for approval'); return false;
}
function decide(id, status) {
  const d = S.disb.find(x => x.id === id);
  if (d.by === S.me) return fail('You cannot approve or reject your own request');
  if (d.status !== 'requested') return fail('Already decided');
  d.status = status; d.decided = S.me;
  log(`${status === 'approved' ? 'Approved' : 'Rejected'} ${id.toUpperCase()} (${kes(d.amount)})`);
  save(); render(); toast(status === 'approved' ? 'Approved. Pay it, then record the M-Pesa reference.' : 'Request rejected');
}
let paying = null;
function markPaid(id) {
  const ref = (document.getElementById('mpesa-ref')?.value || '').trim().toUpperCase();
  if (!ref) return fail('Record the M-Pesa reference before marking as paid');
  const d = S.disb.find(x => x.id === id);
  d.status = 'paid'; d.mpesa = ref; paying = null;
  log(`Marked ${id.toUpperCase()} as paid (M-Pesa ${ref})`);
  save(); render(); toast('Marked as paid');
}
function enterTally(form, fid) {
  const d = new FormData(form);
  const f = S.forms.find(x => x.id === fid);
  if (f.entries.some(e => e.by === S.me)) return fail('You already entered this form. A different clerk must do the second entry.');
  const votes = Object.fromEntries(S.cands.map(c => [c.id, +d.get(c.id)]));
  f.entries.push({ by:S.me, votes, rej:+d.get('rej') });
  let msg = 'Entry saved. Waiting for the second clerk.';
  if (f.entries.length === 2) {
    const [a, b] = f.entries;
    const same = a.rej === b.rej && S.cands.every(c => a.votes[c.id] === b.votes[c.id]);
    if (same) { f.status = 'confirmed'; f.final = { votes:{...a.votes}, rej:a.rej }; msg = 'Both entries match. Station confirmed and added to the tally.'; }
    else { f.status = 'disputed'; msg = 'Entries differ. Sent to the campaign manager to check against the photo.'; }
  }
  log(`Entered Form 34A for ${station(f.station).name}${f.status === 'confirmed' ? ' (confirmed)' : f.status === 'disputed' ? ' (entries differ)' : ''}`);
  save(); render(); toast(msg, f.status === 'disputed'); return false;
}
function resolve(fid, idx) {
  const f = S.forms.find(x => x.id === fid);
  const e = f.entries[idx];
  f.status = 'confirmed'; f.final = { votes:{...e.votes}, rej:e.rej };
  log(`Resolved ${station(f.station).name}: accepted ${member(e.by).name}'s entry`);
  save(); render(); toast('Station confirmed');
}

render();
</script>
